name: pages

# Publishes the app as a static site (GitHub Pages). It needs no build step: the repository is the site, plus the
# ngspice WebAssembly bundle that `npm ci` copies into vendor/ngspice.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest icon.svg sw.js css js vendor _site/
          echo "{\"version\":\"$(git rev-parse --short HEAD)\"}" > _site/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
