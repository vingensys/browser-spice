name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: engine, ngspice cross-check, graph and logic maths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ngspice (the cross-check compares the engine with it)
        run: sudo apt-get update && sudo apt-get install -y ngspice
      - run: npm ci
      - run: npm test
      - name: Same engine tests with the sparse solver forced on
        run: SPARSE=1 npm test

  browser:
    name: editor, UI, graphs, rule check (headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Browser suites
        run: npm run test:browser
        env:
          CHROME_PATH: /usr/bin/google-chrome
