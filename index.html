<!DOCTYPE html>
<html lang="en" data-theme="classic">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser SPICE - Schematic Capture & Simulation</title>
    <link rel="stylesheet" href="css/app.css">
</head>

<body>
    <div id="app">
        <div id="menubar"></div>
        <div id="toolbar"></div>

        <div id="main">
            <aside id="leftpane">
                <div class="pane-title"><span>OVERVIEW</span></div>
                <div id="overview-wrap"><canvas id="overview"></canvas></div>
                <div id="leftrow">
                    <div id="modebar"></div>
                    <div id="devicepane">
                        <div class="pane-title">
                            <span id="devtitle">DEVICES</span>
                            <span>
                                <button class="pane-btn" id="pickBtn" title="Pick devices (P)">P</button><button class="pane-btn" id="removeBtn" title="Remove the selected device from the list">−</button>
                            </span>
                        </div>
                        <ul id="devicelist"></ul>
                        <div id="devpreview-wrap"><canvas id="devpreview"></canvas></div>
                        <div id="rotbar"></div>
                    </div>
                </div>
            </aside>

            <section id="center">
                <div id="sheetwrap"><canvas id="schematic" tabindex="0"></canvas></div>
                <div id="graphwin" class="hidden"></div>
            </section>
        </div>

        <div id="statusbar"></div>
    </div>

    <div id="dialog-layer"></div>
    <div id="contextMenu" class="context-menu"></div>
    <div id="toast" class="toast"></div>

    <!-- parked UI that dialogs borrow: the simulation settings form and the part properties -->
    <div class="hidden">
        <div id="settings-form" class="form-grid" style="width:420px">
            <h4 class="span">Transient</h4>
            <label>Stop time</label><input id="simTstop" value="20m">
            <label>Maximum step</label><input id="simTstep" value="20u">
            <label>Start from zero (UIC)</label><span><input id="simUic" type="checkbox" checked style="width:auto"> capacitors / inductors start empty</span>
            <label>Live simulation speed</label>
            <select id="liveSpeed" title="Simulated seconds per real second while the Play button is running">
                <option value="1">1× (real time)</option>
                <option value="0.1" selected>0.1×</option>
                <option value="0.01">0.01×</option>
                <option value="0">As fast as possible</option>
            </select>
            <h4 class="span">AC sweep</h4>
            <label>Start frequency (Hz)</label><input id="simFstart" value="10">
            <label>Stop frequency (Hz)</label><input id="simFstop" value="1M">
            <h4 class="span">DC sweep</h4>
            <label>Source</label><select id="sweepSrc"><option value="">(no sources)</option></select>
            <label>From</label><input id="sweepStart" value="0">
            <label>To</label><input id="sweepStop" value="5">
            <label>Step</label><input id="sweepStep" value="0.1">
            <h4 class="span">Environment</h4>
            <label>Temperature (°C)</label><input id="simTemp" value="27">
            <label>Solver</label>
            <select id="simEngine" title="Built-in: instant and interactive. ngspice: the industry-standard solver (loads on first use).">
                <option value="builtin">Built-in (fast, live)</option>
                <option value="ngspice">ngspice (accurate, graphs only)</option>
            </select>
        </div>
        <div id="props-store"><div id="propertiesContent"></div></div>
    </div>

    <input type="file" id="fileInput" accept=".json" class="hidden">
    <input type="file" id="spiceInput" accept=".cir,.net,.sp,.spice,.lib,.mod,.txt" class="hidden">

    <!-- foundations -->
    <script src="js/utils/complex.js"></script>
    <script src="js/utils/units.js"></script>

    <!-- simulation engine -->
    <script src="js/sim/linalg.js"></script>
    <script src="js/sim/devices.js"></script>
    <script src="js/sim/models.js"></script>
    <script src="js/sim/engine.js"></script>
    <script src="js/sim/spice-parser.js"></script>
    <script src="js/sim/model-library.js"></script>
    <script src="js/sim/ngspice-backend.js"></script>

    <!-- schematic editor -->
    <script src="js/ui/theme.js"></script>
    <script src="js/cad/symbols.js"></script>
    <script src="js/cad/router.js"></script>
    <script src="js/cad/symbol-draw.js"></script>
    <script src="js/visualization/schematic.js"></script>
    <script src="js/visualization/waveform.js"></script>

    <!-- netlist bridge + application UI -->
    <script src="js/circuit/netlist.js"></script>
    <script src="js/ui/icons.js"></script>
    <script src="js/ui/commands.js"></script>
    <script src="js/ui/properties.js"></script>
    <script src="js/ui/sim-runner.js"></script>
    <script src="js/ui/spice-import.js"></script>
    <script src="js/ui/catalog.js"></script>
    <script src="js/ui/dialogs.js"></script>
    <script src="js/ui/device-list.js"></script>
    <script src="js/ui/menubar.js"></script>
    <script src="js/ui/toolbars.js"></script>
    <script src="js/ui/statusbar.js"></script>
    <script src="js/ui/overview.js"></script>
    <script src="js/ui/graph-window.js"></script>
    <script src="js/ui/live-sim.js"></script>
    <script src="js/examples.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
